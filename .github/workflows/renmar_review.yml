name: Renmar Flutter Total Quality

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Automated Repairs
        # This adds 'const' and removes unused imports automatically
        run: dart fix --apply 

      - name: Standard Formatting
        run: dart format .

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: automated Renmar standards fix"

  ai-review:
    needs: compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Gemini AI Reviewer
        uses: sshnaidm/gemini-code-review-action@v1
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-2.0-flash"
          prompt: |
            You are the Lead Architect at Renmar.
            Logic & Readability Focus:
            1. Ensure API calls are in services/, not UI.
            2. Flag widgets over 150 lines.
            3. Verify documentation (///) on public methods.
            4. Suggest architectural improvements.
