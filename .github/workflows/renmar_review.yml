name: Renmar Flutter Quality Control

on:
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize]

jobs:
  # PHASE 1: Automated Linting (Fast & Strict)
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Verify Renmar Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static Analysis
        run: flutter analyze

  # PHASE 2: AI Architectural Review (Deep Insights)
  ai-review:
    needs: compliance # Only runs if code isn't broken
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Renmar AI Senior Reviewer
        uses: sshnaidm/gemini-code-review-action@v1
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-2.0-flash" # High speed, zero cost
          prompt: |
            You are the Lead Architect at Renmar Infrastructure Corp. 
            Review this Flutter PR strictly based on these internal docs:

            ### 1. STRUCTURE & NAMING (CRITICAL)
            - Folder check: Must be in models/, screens/, widgets/, services/, or utils/.
            - File names: MUST be snake_case (e.g., login_screen.dart).
            - Classes: PascalCase. Vars: camelCase. Private: start with (_).

            ### 2. UI & PERFORMANCE
            - PERFORMANCE: Flag missing 'const' constructors. 
            - NESTING: Flag widgets nested more than 4 levels deep; suggest splitting into smaller widgets.
            - LISTS: Ensure ListView.builder is used for dynamic content.

            ### 3. SCALABILITY & READABILITY
            - REUSABILITY: If a widget is >150 lines, suggest breaking it up.
            - LOGIC: Ensure API/Business logic is in services/, NOT in the UI.
            - DOCS: Public methods MUST use '///' documentation.
            - ERRORS: Async calls MUST have try-catch blocks. No empty catches.

            Provide specific line-by-line suggestions for improvement.
